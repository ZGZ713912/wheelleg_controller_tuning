# 贝叶斯优化搜索空间配置

# 高优先级参数（Phase 1: 核心稳定性）
core_stability:
  lqr_gain_theta:
    range: [-30.0, -5.0]
    default: -17.6
    priority: high
  
  lqr_gain_thetadot:
    range: [-10.0, -1.0]
    default: -3.6
    priority: high
  
  lqr_gain_v:
    range: [-5.0, -1.0]
    default: -3.0
    priority: high
  
  yaw_gain_psi:
    range: [-15.0, -5.0]
    default: -10.8
    priority: high
  
  yaw_gain_psidot:
    range: [-8.0, -2.0]
    default: -4.3
    priority: high

# 中优先级参数（Phase 2: 扩展优化）
extended:
  outer_kv:
    range: [0.0, 10.0]
    default: 0.0
    priority: medium
  
  outer_kx:
    range: [0.0, 5.0]
    default: 0.0
    priority: medium
  
  lqr_torque_limit:
    range: [3.0, 8.0]
    default: 4.88
    priority: medium
  
  yaw_torque_diff_limit:
    range: [4.0, 12.0]
    default: 8.0
    priority: medium
  
  leg_motion_coupling:
    range: [0.0, 0.1]
    default: 0.0
    priority: medium

# 低优先级参数（Phase 3: 精调）
fine_tuning:
  nominal_leg_length:
    range: [0.25, 0.40]
    default: 0.305
    priority: low
  
  command_accel_limit:
    range: [0.5, 3.0]
    default: 2.0
    priority: low
  
  command_jerk_limit:
    range: [1.0, 10.0]
    default: 5.0
    priority: low
  
  shank_knee_transition_time:
    range: [0.5, 4.0]
    default: 1.5
    priority: low

# Optuna 采样器配置
sampler:
  type: TPESampler
  n_startup_trials: 20
  multivariate: true
  seed: 42

# Pruner 配置
pruner:
  type: MedianPruner
  n_startup_trials: 10
  n_warmup_steps: 5

# 优化目标
objectives:
  - name: reward
    direction: maximize
    weight: 1.0
  
  - name: velocity_mae
    direction: minimize
    weight: 1.0
  
  - name: survival_time
    direction: maximize
    weight: 1.0
